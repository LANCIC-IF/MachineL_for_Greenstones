[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BasicFunctions"
version = "0.1.0"
description = "basic funcions for processing signals" 
authors = [{name = "Liat Colmenares", email = "liat@estudiantes.fisica.unam.mx"}]
readme = "README.md"
dependencies = ["numpy", "matplotlib", "pandas", "pybaselines", "SciPy"]

[project.optional-dependencies]
test = ["pytest>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
